# Runs the published image from Docker Hub. To build from this source
# instead, add the override file:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  nightshift:
    image: sirajju/archie:${NIGHTSHIFT_TAG:-latest}
    pull_policy: always
    container_name: nightshift
    restart: unless-stopped
    ports:
      - "${NIGHTSHIFT_PORT:-4404}:4404"
    environment:
      # Office time zone: night-shift cases and eggs open 19:00-06:00 local time.
      TZ: ${TZ:-Asia/Kolkata}
      # Turns on the organiser API. Leave empty to keep it off.
      NIGHTSHIFT_ADMIN_KEY: ${NIGHTSHIFT_ADMIN_KEY:-}
    volumes:
      - nightshift-data:/data
      # Uncomment to edit cases without rebuilding (the server reloads them live):
      # - ./content:/app/content:ro

volumes:
  nightshift-data:
    name: ${NIGHTSHIFT_VOLUME:-nightshift-data}
