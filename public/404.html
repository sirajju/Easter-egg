<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Not here</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f4eddc; --ink: #252b33; --stamp: #b3362b; --line: #cdb67c; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #13151a; --ink: #e8e1cf; --stamp: #ec6d5f; --line: #343a46; color-scheme: dark; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.6 "Courier New", monospace; padding: 24px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
    main { max-width: 32rem; display: flex; flex-direction: column; gap: 1rem; }
    .stamp { align-self: flex-start; border: 3px solid var(--stamp); color: var(--stamp); padding: .1rem .7rem; font-size: 2rem; transform: rotate(-8deg); letter-spacing: .1em; }
    #code { border: 1px dashed var(--line); padding: .8rem 1rem; user-select: all; }
    a { color: var(--stamp); }
  </style>
</head>
<body data-egg="lost-page">
  <main>
    <span class="stamp">404</span>
    <p>This page left at 5pm and didn't say where it was going. ARCHIE has filed a missing-page report.</p>
    <p>ARCHIE apologises. ARCHIE apologises again. ARCHIE is very sorry. ARCHIE leaves you something for your trouble:</p>
    <p id="code">…</p>
    <p><a href="/">Back to the case board</a></p>
  </main>
  <script src="/hidden-page.js"></script>
</body>
</html>
