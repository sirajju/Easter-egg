<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Basement</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0c0f; color: #cfc7b4; font: 15px/1.6 "Courier New", monospace; padding: 24px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
    main { max-width: 34rem; display: flex; flex-direction: column; gap: 1rem; }
    h1 { font-weight: 400; letter-spacing: 0.2em; margin: 0; color: #e0b45a; }
    .bulb { width: 12px; height: 12px; border-radius: 50%; background: #e0b45a; box-shadow: 0 0 30px 10px rgba(224,180,90,.35); animation: f 3s infinite; }
    @keyframes f { 0%,90%,100% { opacity: 1 } 93% { opacity: .2 } 96% { opacity: .8 } }
    #code { border: 1px dashed #4a4436; padding: .8rem 1rem; user-select: all; }
    a { color: #86aedc; }
    @media (prefers-reduced-motion: reduce) { .bulb { animation: none; } }
  </style>
</head>
<body data-egg="basement">
  <main>
    <div class="bulb" aria-hidden="true"></div>
    <h1>B1 · STORAGE</h1>
    <p>Boxes of printouts. A camp bed. A mug that says <em>WORLD'S OKAYEST SYSADMIN</em>. A terminal, still logged in as <strong>m.</strong></p>
    <p>On the screen, one line blinks:</p>
    <p id="code">Waking up…</p>
    <p><a href="/">Go back upstairs</a></p>
  </main>
  <script src="/hidden-page.js"></script>
</body>
</html>
